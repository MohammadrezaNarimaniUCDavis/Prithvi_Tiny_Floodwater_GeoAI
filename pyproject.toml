[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floodwater"
version = "1.0.0"
description = "Metrics, water-index baselines, splits, and model factory for compact Prithvi floodwater segmentation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Parastoo Farajpoor" },
  { name = "Mohammadreza Narimani", email = "mnarimani@ucdavis.edu" },
]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
prithvi = ["torch>=2.1", "terratorch>=1.2"]

[tool.setuptools.packages.find]
include = ["floodwater*"]
